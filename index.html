        async function aggiornaDashboardHome() {
            const homeSedeSelect = document.getElementById('home-select-sede');
            if (homeSedeSelect.value) {
                ultimaSedeSelezionata = homeSedeSelect.value;
            } else {
                ultimaSedeSelezionata = "";
            }

            const oggi = new Date();
            const y = oggi.getFullYear();
            const m = String(oggi.getMonth() + 1).padStart(2, '0');
            const d = String(oggi.getDate()).padStart(2, '0');
            const oggiStrLocale = `${y}-${m}-${d}`;
            
            document.getElementById('home-data-oggi').textContent = oggi.toLocaleDateString('it-IT');

            const { data, error } = await db.from('contratti').select('*');
            if (error) return;

            let filtrati = data.filter(c => c.data_creazione && c.data_creazione.split('T')[0] === oggiStrLocale);

            if (ultimaSedeSelezionata) {
                filtrati = filtrati.filter(c => c.sede_id == ultimaSedeSelezionata);
            }

            let totale = 0, chiusi = 0, sospesi = 0, ko = 0, fittizi = 0;

            filtrati.forEach(c => {
                totale++;
                if (c.ko_non_conta) ko++;
                else if (c.fittizio) fittizi++;
                else if (!c.codice_carrello || c.codice_carrello.trim() === '') sospesi++;
                else chiusi++;
            });

            document.getElementById('home-totale').textContent = totale;
            document.getElementById('home-chiusi').textContent = chiusi;
            document.getElementById('home-sospesi').textContent = sospesi;
            document.getElementById('home-ko').textContent = ko;
        }

        function aggiornaStatoCampi() {

            const inputPod = document.getElementById('input-pod'), inputPdr = document.getElementById('input-pdr');

            if (chkLuce.checked && chkGas.checked) { chkDual.checked = true; chkLuce.checked = false; chkGas.checked = false; }
            if (chkDual.checked) { chkLuce.checked = false; chkLuce.disabled = true; chkGas.checked = false; chkGas.disabled = true; } 
            else { chkLuce.disabled = false; chkGas.disabled = false; }
            
            if (chkLuce.checked || chkDual.checked) { inputPod.disabled = false; inputPod.classList.remove('bg-gray-200'); } 
            else { inputPod.disabled = true; inputPod.value = ''; inputPod.classList.add('bg-gray-200'); }
            
            if (chkGas.checked || chkDual.checked) { inputPdr.disabled = false; inputPdr.classList.remove('bg-gray-200'); } 
            else { inputPdr.disabled = true; inputPdr.value = ''; inputPdr.classList.add('bg-gray-200'); }
        }

        async function apriModifica(id) {
            const { data, error } = await db.from('contratti').select('*').eq('id', id).single();
            if (error) { alert("Errore nel caricamento del contratto"); return; }

            idContrattoInModifica = id;
            spostaFormIn('container-modal'); 

            const dataPura = data.data_creazione ? data.data_creazione.split('T')[0] : '';
            document.getElementById('input-data').value = dataPura;

            document.getElementById('select-promoter').value = data.promoter_id || '';
            document.getElementById('select-sede').value = data.sede_id || '';
            document.getElementById('input-cliente').value = data.cliente_nome || '';
            document.getElementById('input-cf').value = data.codice_fiscale || '';
            document.getElementById('input-cellulare').value = data.cellulare || '';
            document.getElementById('input-carrello').value = data.codice_carrello || '';
            document.getElementById('input-note').value = data.note || '';

            let pod = "", pdr = "";
            let str = data.pod_pdr || "";
            if (str.includes("POD: ") && str.includes(" | PDR: ")) {
                let parts = str.split(" | PDR: "); pod = parts[0].replace("POD: ", ""); pdr = parts[1];
            } else {
                if (data.gas && !data.dual_attivato) pdr = str; else pod = str;
            }
            document.getElementById('input-pod').value = pod;
            document.getElementById('input-pdr').value = pdr;

            document.getElementById('chk-luce').checked = data.luce;
            document.getElementById('chk-gas').checked = data.gas;
            document.getElementById('chk-dual').checked = data.dual_attivato;
            document.getElementById('chk-fibra').checked = data.fibra;
            document.getElementById('chk-polizza').checked = data.polizza;
            document.getElementById('chk-iban').checked = data.iban;
            document.getElementById('chk-bollettino').checked = data.bollettino;
            document.getElementById('chk-fittizio').checked = data.fittizio;
            document.getElementById('chk-ko').checked = data.ko_non_conta;

            document.getElementById('titolo-form').textContent = "✏️ Modifica Contratto";
            
            const btn = document.getElementById('btn-salva');
            btn.textContent = "Aggiorna Contratto";
            btn.disabled = false;

            document.getElementById('btn-annulla-nuovo').classList.add('hidden');
            document.getElementById('btn-annulla-modifica').classList.remove('hidden');
            
            gestisciFittizio();
            aggiornaStatoCampi();
            document.getElementById('modal-modifica').classList.remove('hidden');
        }

        async function eliminaContratto(id) {
            if (!confirm("Sei sicuro di voler eliminare definitivamente questo contratto?")) return;
            const { error } = await db.from('contratti').delete().eq('id', id);
            if (error) {
                alert("Errore durante l'eliminazione: " + error.message);
            } else {
                caricaRegistro();

        }

        async function salvaContratto(event) {
            event.preventDefault(); 
            const msg = document.getElementById('messaggio-esito');
            const btn = document.getElementById('btn-salva');
            
            btn.disabled = true; 
            btn.textContent = "Salvataggio in corso...";

            const pod_val = document.getElementById('input-pod').value.trim();
            const pdr_val = document.getElementById('input-pdr').value.trim();
            let pod_pdr_combinato = (pod_val && pdr_val) ? `POD: ${pod_val} | PDR: ${pdr_val}` : (pod_val || pdr_val || "");

            let dataSelezionata = document.getElementById('input-data').value;
            if(dataSelezionata) { dataSelezionata = dataSelezionata + 'T12:00:00Z'; }

            const sedeScelta = document.getElementById('select-sede').value;
            if (sedeScelta) {
                ultimaSedeSelezionata = sedeScelta;
                document.getElementById('home-select-sede').value = ultimaSedeSelezionata; 
            }

            const isFittizio = document.getElementById('chk-fittizio').checked;
            const promoter_val = isFittizio ? null : (parseInt(document.getElementById('select-promoter').value) || null);

            const payload = {
                data_creazione: dataSelezionata,
                promoter_id: promoter_val,
                sede_id: parseInt(sedeScelta) || null,
                cliente_nome: document.getElementById('input-cliente').value,
                codice_fiscale: document.getElementById('input-cf').value.toUpperCase(),
                cellulare: document.getElementById('input-cellulare').value,
                pod_pdr: pod_pdr_combinato,
                codice_carrello: document.getElementById('input-carrello').value,
                note: document.getElementById('input-note').value,
                luce: document.getElementById('chk-luce').checked,
                gas: document.getElementById('chk-gas').checked,
                dual_attivato: document.getElementById('chk-dual').checked,
                fibra: document.getElementById('chk-fibra').checked,
                polizza: document.getElementById('chk-polizza').checked,
                iban: document.getElementById('chk-iban').checked,
                bollettino: document.getElementById('chk-bollettino').checked,
                fittizio: isFittizio,
                ko_non_conta: document.getElementById('chk-ko').checked
            };

            let error = null;

            if (idContrattoInModifica) {
                const res = await db.from('contratti').update(payload).eq('id', idContrattoInModifica);
                error = res.error;
            } else {
                const res = await db.from('contratti').insert([payload]);
                error = res.error;
            }

            if (error) {
                msg.textContent = "Errore: " + error.message; msg.className = "text-center mt-3 font-semibold text-red-600";
                btn.disabled = false; btn.textContent = idContrattoInModifica ? "Aggiorna Contratto" : "Salva Contratto";
            } else {
                msg.textContent = idContrattoInModifica ? "✅ Contratto aggiornato!" : "✅ Contratto registrato!"; 
                msg.className = "text-center mt-3 font-semibold text-green-600";
                
                setTimeout(() => {
                    msg.textContent = "";
                    if (idContrattoInModifica) {
                        chiudiModalModifica(); 
                        caricaRegistro(); 
                    } else {
                        resettaForm();
                        aggiornaDashboardHome();
                    }
                }, 1500); 
            }
        }

        async function caricaRegistro() {
            document.getElementById('tabella-registro').innerHTML = '<tr><td colspan="7" class="text-center p-4">Caricamento in corso...</td></tr>';

            const { data, error } = await db.from('contratti').select(`*, promoter (nome, cognome), sedi (nome)`).order('data_creazione', { ascending: false });
            if (error) {
                document.getElementById('tabella-registro').innerHTML = `<tr><td colspan="7" class="text-center p-4 text-red-600">Errore: ${error.message}</td></tr>`;
                return;
            }

            tuttiIContratti = data;
            applicaFiltri();
        }

        function applicaFiltri() {
            const ricerca = document.getElementById('filtro-ricerca').value.toLowerCase();
            const promoterId = document.getElementById('filtro-promoter').value;
            const sedeId = document.getElementById('filtro-sede').value;
            const dataDa = document.getElementById('filtro-data-da').value;
            const dataA = document.getElementById('filtro-data-a').value;

            contrattiFiltrati = tuttiIContratti.filter(c => {
                let matchRicerca = true;
                if (ricerca) {
                    const nome = (c.cliente_nome || '').toLowerCase();
                    const cf = (c.codice_fiscale || '').toLowerCase();
                    const su = (c.codice_carrello || '').toLowerCase();
                    matchRicerca = nome.includes(ricerca) || cf.includes(ricerca) || su.includes(ricerca);
                }

                let matchPromoter = true;
                if (promoterId) matchPromoter = c.promoter_id == promoterId;

                let matchSede = true;
                if (sedeId) matchSede = c.sede_id == sedeId;

                let matchData = true;
                if (dataDa || dataA) {
                    const dataContratto = c.data_creazione.split('T')[0];
                    if (dataDa && dataContratto < dataDa) matchData = false;
                    if (dataA && dataContratto > dataA) matchData = false;
                }

                return matchRicerca && matchPromoter && matchSede && matchData;
            });

            paginaCorrente = 1;
            renderTabella();
        }

        function resettaFiltri() {
            document.getElementById('filtro-ricerca').value = '';
            document.getElementById('filtro-promoter').value = '';
            document.getElementById('filtro-sede').value = '';
            document.getElementById('filtro-data-da').value = '';
            document.getElementById('filtro-data-a').value = '';
            applicaFiltri();
        }

        function cambiaElementiPerPagina() {
            const val = parseInt(document.getElementById('select-per-pagina').value);
            contrattiPerPagina = val;
            paginaCorrente = 1;
            renderTabella();
        }

        function renderTabella() {
            const tbody = document.getElementById('tabella-registro');
            tbody.innerHTML = '';

            const inizio = (paginaCorrente - 1) * contrattiPerPagina;
            const fine = inizio + contrattiPerPagina;
            const paginaDati = contrattiFiltrati.slice(inizio, fine);

            if (paginaDati.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4">Nessun contratto trovato.</td></tr>';
            } else {
                paginaDati.forEach(c => {
                    let badgeStato = '<span class="px-2 py-1 bg-green-100 text-green-800 rounded font-bold text-xs">CHIUSO</span>';
                    if (c.ko_non_conta) badgeStato = '<span class="px-2 py-1 bg-red-100 text-red-800 rounded font-bold text-xs">KO</span>';
                    else if (c.fittizio) badgeStato = '<span class="px-2 py-1 bg-gray-200 text-gray-800 rounded font-bold text-xs">FITTIZIO</span>';
                    else if (!c.codice_carrello || c.codice_carrello.trim() === '') badgeStato = '<span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded font-bold text-xs">SOSPESO</span>';

                    let fornit = [];
                    if (c.luce) fornit.push('Luce');
                    if (c.gas) fornit.push('Gas');
                    if (c.dual_attivato) fornit.push('Dual');
                    if (c.fibra) fornit.push('Fibra');
                    if (c.polizza) fornit.push('Polizza');

                    const dataFormat = new Date(c.data_creazione).toLocaleDateString('it-IT');
                    const nomePromoter = c.promoter ? `${c.promoter.nome} ${c.promoter.cognome}` : (c.fittizio ? '<span class="text-gray-400 italic">Fittizio (Nessuno)</span>' : 'Sconosciuto');
                    const nomeSede = c.sedi ? c.sedi.nome : '-';

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3 text-sm">${dataFormat}</td>
                            <td class="p-3 text-sm">
                                <span class="font-semibold text-gray-900">${nomePromoter}</span><br>
                                <span class="text-xs text-blue-600 font-medium">${nomeSede}</span>
                            </td>
                            <td class="p-3 text-sm uppercase font-bold">${c.cliente_nome || '-'}</td>
                            <td class="p-3 text-sm">${fornit.join(', ')}</td>
                            <td class="p-3">
                                <div class="flex items-center gap-1">
                                    <input type="text" value="${c.codice_carrello || ''}" id="su-${c.id}" oninput="mostraSalvaSU(${c.id})" class="border rounded p-1 w-full text-sm bg-white" placeholder="SU...">
                                    <button id="btn-su-${c.id}" onclick="aggiornaSU(${c.id})" class="hidden text-xs bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">Salva</button>
                                </div>
                            </td>
                            <td class="p-3 text-center">${badgeStato}</td>
                            <td class="p-3 text-center flex flex-col gap-1">
                                <button onclick="apriDettagli(${c.id})" class="text-xs bg-gray-500 text-white px-2 py-1 rounded hover:bg-gray-600 w-full">Dettagli</button>
                                <button onclick="apriModifica(${c.id})" class="text-xs bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600 w-full">Modifica</button>
                                <button onclick="eliminaContratto(${c.id})" class="text-xs bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700 w-full">Elimina</button>
                            </td>
                        </tr>
                    `;
                });
            }
            aggiornaControlliPaginazione();
        }

        function mostraSalvaSU(id) {
            document.getElementById(`btn-su-${id}`).classList.remove('hidden');
        }

        async function aggiornaSU(id_contratto) {
            const nuovoSU = document.getElementById(`su-${id_contratto}`).value;
            const { error } = await db.from('contratti').update({ codice_carrello: nuovoSU }).eq('id', id_contratto);
            if (!error) {
                document.getElementById(`btn-su-${id_contratto}`).classList.add('hidden');
                const idx = tuttiIContratti.findIndex(c => c.id === id_contratto);
                if(idx > -1) tuttiIContratti[idx].codice_carrello = nuovoSU;
                applicaFiltri(); 
            } else alert("Errore nel salvataggio del SU");
        }

        function aggiornaControlliPaginazione() {
            const totale = contrattiFiltrati.length;
            const totalePagine = Math.ceil(totale / contrattiPerPagina) || 1;
            
            let inizioContatore = (paginaCorrente - 1) * contrattiPerPagina + 1;
            let fineContatore = Math.min(paginaCorrente * contrattiPerPagina, totale);
            if (totale === 0) { inizioContatore = 0; fineContatore = 0; }

            document.getElementById('info-pagina').innerHTML = `Visualizzati <span class="font-bold text-blue-600">${inizioContatore}-${fineContatore}</span> su <span class="font-bold text-blue-600">${totale}</span> totali`;
            
            document.getElementById('btn-prev').disabled = (paginaCorrente === 1);
            document.getElementById('btn-next').disabled = (paginaCorrente === totalePagine);
        }

        function cambiaPagina(delta) {
            paginaCorrente += delta;
            renderTabella();
        }
